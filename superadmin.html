<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IMS System - Superadmin</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body class="bg-slate-950">
<script>window.IMS_ROLE='superadmin';</script>
<script type="module" src="./ims-app.js"></script><script src="./layout-core.js"></script><script src="./nav-active-fix.js"></script><script src="./date-standard.js"></script><script type="module" src="./classification-master.js"></script><script type="module" src="./registration-classification.js"></script><script type="module" src="./registration-workflow.js"></script><script type="module" src="./recent-items.js"></script><script type="module" src="./item-detail-history.js"></script><script type="module" src="./item-record-export.js"></script><script type="module" src="./stock-directory.js"></script><script type="module" src="./scalable-logs.js"></script><script type="module" src="./batch-movement.js"></script><script type="module" src="./maintenance-workflow.js"></script><script type="module" src="./maintenance-supplier.js"></script><script type="module" src="./invoice-management.js"></script><script type="module" src="./superadmin-reset.js"></script><script src="./sortable-tables.js"></script>
<script type="module">
import { auth, db } from './firebase-config.js';import { doc,getDoc,setDoc,addDoc,collection } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
const allowedRestoreCollections=['settings','client_profiles','supplier_profiles','registration_batches','inventory','movements','maintenance_events','client_docs','supplier_docs','document_refs','operational_logs','audit_traces'];
function ensureRestoreControl(){const backupBtn=document.getElementById('downloadBackup');if(!backupBtn||document.getElementById('restoreBackup'))return;const wrap=backupBtn.parentElement,btn=document.createElement('button');btn.id='restoreBackup';btn.type='button';btn.className='bg-amber-700 hover:bg-amber-600 px-4 py-2 rounded-lg text-xs font-bold';btn.textContent='Restore Backup JSON';wrap.appendChild(btn);const input=document.createElement('input');input.id='restoreBackupFile';input.type='file';input.accept='.json,application/json';input.className='hidden';wrap.appendChild(input);btn.onclick=()=>input.click();input.onchange=()=>restoreBackupFile(input.files?.[0]);}
async function restoreBackupFile(file){if(!file)return;const user=auth.currentUser;if(!user)return alert('You must be signed in.');let payload;try{payload=JSON.parse(await file.text())}catch{return alert('Invalid JSON file.')}if(!payload||Number(payload.imsBackupVersion)!==2||!payload.collections)return alert('This is not a valid IMS backup version 2 file.');const userSnap=await getDoc(doc(db,'users',user.uid)),profile=userSnap.exists()?userSnap.data():null;if(!profile||profile.role!=='superadmin'||profile.status!=='active')return alert('Restore is restricted to an active Superadmin account.');let total=0;const summary={};for(const name of allowedRestoreCollections){const rows=Array.isArray(payload.collections[name])?payload.collections[name]:[];summary[name]=rows.length;total+=rows.length}if(!total)return alert('The backup contains no supported records to restore.');if(!confirm(`Restore ${total} record(s)?\n\nMerge mode keeps newer documents. Users/Auth are not restored.`))return;const btn=document.getElementById('restoreBackup');btn.disabled=true;btn.textContent='Restoring...';let restored=0;const errors=[];for(const name of allowedRestoreCollections){for(const row of Array.isArray(payload.collections[name])?payload.collections[name]:[]){if(!row?.id||!row?.data){errors.push(`${name}: invalid record`);continue}try{await setDoc(doc(db,name,row.id),row.data,{merge:true});restored++}catch(err){errors.push(`${name}/${row.id}: ${err?.message||err}`)}}}await addDoc(collection(db,'audit_traces'),{traceVersion:3,actionType:'RESTORE_SYSTEM_BACKUP',module:'Global Settings',targetType:'backup',targetName:'Merge System Restore',targetId:'',summary:'Restore System Backup',beforeValue:null,afterValue:{restored,errors:errors.length,collections:summary},changedFields:['restored','errors','collections'],remark:'Merge restore from IMS backup JSON. User profiles excluded.',metadata:{fileName:file.name,backupVersion:payload.imsBackupVersion,excludedCollections:['users']},performedBy:profile.email||user.email||'',performedByRole:'superadmin',performedAt:new Date().toISOString()});alert(`Restore completed. Restored: ${restored}. Errors: ${errors.length}.`);location.reload()}
new MutationObserver(ensureRestoreControl).observe(document.body,{childList:true,subtree:true});ensureRestoreControl();
</script></body></html>

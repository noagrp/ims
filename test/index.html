<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS TEST</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border border-amber-600/60 box-border">
  <div class="text-center text-xs font-bold tracking-widest text-amber-400 mb-2">TEST VERSION</div>
  <h2 class="text-xl sm:text-2xl font-bold mb-6 text-center text-cyan-400">IMS Portal Login</h2>
  <button id="googleSignIn" type="button" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-2.5 px-4 rounded-lg text-sm">Sign in with Google</button>
  <div class="flex items-center gap-3 my-5"><div class="h-px bg-slate-700 flex-1"></div><span class="text-xs text-slate-500">OR</span><div class="h-px bg-slate-700 flex-1"></div></div>
  <form id="loginForm" class="space-y-4">
    <div><label class="block text-sm font-medium mb-1">Email Address</label><input type="email" id="email" required class="w-full px-3 py-2.5 bg-slate-900 rounded-lg border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm"></div>
    <div><label class="block text-sm font-medium mb-1">Password</label><input type="password" id="password" required class="w-full px-3 py-2.5 bg-slate-900 rounded-lg border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm"></div>
    <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm">Sign In</button>
  </form>
  <p id="errorMsg" class="text-red-400 text-xs sm:text-sm mt-4 text-center hidden break-words"></p>
</div>
<script type="module">
import { auth, db } from '../firebase-config.js';
import { signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
const errorMsg=document.getElementById('errorMsg'), googleButton=document.getElementById('googleSignIn');
function showError(message){errorMsg.innerText=message;errorMsg.classList.remove('hidden');}
function clearError(){errorMsg.innerText='';errorMsg.classList.add('hidden');}
async function authorizeAndRedirect(user){
  const userDoc=await getDoc(doc(db,'users',user.uid));
  if(!userDoc.exists()){await signOut(auth);showError('This account is not registered for IMS.');return;}
  const profile=userDoc.data();
  if(profile.status!=='active'){await signOut(auth);showError('This account is inactive.');return;}
  if(profile.role==='superadmin') location.href='superadmin.html';
  else if(profile.role==='manager') location.href='manager.html';
  else if(profile.role==='admin') location.href='admin.html';
  else {await signOut(auth);showError('Role not authorized.');}
}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearError();try{await setPersistence(auth,browserSessionPersistence);const c=await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);await authorizeAndRedirect(c.user);}catch(err){showError(err.message);}});
googleButton.addEventListener('click',async()=>{clearError();googleButton.disabled=true;try{await setPersistence(auth,browserSessionPersistence);const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const result=await signInWithPopup(auth,provider);await authorizeAndRedirect(result.user);}catch(err){showError(err?.code==='auth/popup-closed-by-user'?'Google sign-in was cancelled.':err.message);}finally{googleButton.disabled=false;}});
</script>
</body>
</html>
